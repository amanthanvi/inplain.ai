name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: make venv

      - name: Install web deps
        run: npm --prefix apps/web ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Typecheck
        run: make typecheck

