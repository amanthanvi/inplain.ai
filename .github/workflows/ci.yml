name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint is currently disabled during builds (next.config.mjs) and the
      # true error count is unknown, so this reports without failing CI.
      # Drop continue-on-error once the backlog is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # The suite is known-failing and is being rebuilt around the surviving
      # feature set. Tracked on the wayfinder map.
      - name: Test
        run: npm run test
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # apps/web cannot prerender without a Clerk publishable key: its provider
      # drops <ClerkProvider> when the key is absent, and useUser then throws.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  python:
    name: Scraper (Python)
    runs-on: ubuntu-latest
    # packages/scraper's future is an open decision on the wayfinder map.
    # Kept cheap until that resolves.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt
        working-directory: packages/scraper

      - run: python -m pytest
        working-directory: packages/scraper
