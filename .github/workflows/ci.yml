name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inplain
          POSTGRES_PASSWORD: inplain
          POSTGRES_DB: inplain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inplain -d inplain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inplain:inplain@localhost:5432/inplain_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: make venv

      - name: Install web deps
        run: npm --prefix apps/web ci

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: inplain
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U inplain -d inplain_test && exit 0
            sleep 1
          done
          echo "Postgres not ready" >&2
          exit 1

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Typecheck
        run: make typecheck
