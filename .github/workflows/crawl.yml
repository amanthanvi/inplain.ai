# T6 — the scheduled runtime. There is no always-on process: this workflow IS
# the product's runtime (SPEC §4). It crawls, detects, summarizes, rebuilds the
# static site, pushes the resulting commits, and deploys.
#
# Loop protection (docs/hosting.md §1): the push uses the workflow's own
# GITHUB_TOKEN, and GitHub does not start new workflow runs for events caused
# by GITHUB_TOKEN. NEVER swap this push credential for a PAT or a GitHub App
# token — that would re-arm the crawl-commit → ci.yml loop. ci.yml's
# paths-ignore on documents/** and changes/** is the belt-and-braces layer.
name: crawl

on:
  schedule:
    # Off-peak minute on purpose: GitHub documents that schedule load spikes
    # at the top of every hour and queued jobs can be dropped (hosting.md §2).
    - cron: "17 4 * * *"
  workflow_dispatch: {}

# Two crawls must never overlap and race on the push (hosting.md §1). A
# delayed scheduled run queues behind a manual one instead of cancelling it.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Crawl → detect → push the archive → summarize → build, all in one job: a
  # crawl/detect failure stops the job before the deploy artifact exists, so a
  # failed crawl cannot publish a broken site. The archive (snapshots + change
  # records) is pushed BEFORE summarize so a model-provider outage can never
  # discard the day's crawl; records publish honestly summary-less and the
  # next run retries them. A PARTIAL crawl is a success by design — one
  # unreachable document must not block the others — so inplain.crawl runs
  # without --strict here and per-document problems are surfaced in the step
  # summary instead of failing the run.
  crawl:
    runs-on: ubuntu-latest
    # A hung crawl must not hold the concurrency group for the 6h default
    # while the next scheduled run queues behind it.
    timeout-minutes: 30
    outputs:
      summarize_failed: ${{ steps.summarize.outputs.summarize_failed }}
    permissions:
      contents: write # the crawl commits snapshots and change records back
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # detect walks the git history of documents/, and the push below
          # needs the (default) persisted GITHUB_TOKEN credentials.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock

      - name: Set the workflow's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Crawl the catalog (commits one snapshot per changed document)
        run: |
          set +e
          python -m inplain.crawl | tee "$RUNNER_TEMP/crawl-report.txt"
          status=$?
          set -e
          {
            echo "## Crawl report"
            echo '```'
            cat "$RUNNER_TEMP/crawl-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Rebase the snapshots onto the latest main
        # main may have moved during the run (a merge), which would reject
        # the push below. Rebase HERE, before detect, not just before the
        # push: a Change record is keyed on its Snapshot commit's sha, so the
        # snapshots must have their final shas before any record names them.
        # --autostash: a partial crawl (a failed document or state commit)
        # leaves its file uncommitted, and a plain rebase refuses to start.
        run: git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: Detect changes (documents/ history → changes/*.json)
        run: python -m inplain.detect

      - name: Commit change records
        run: |
          # First snapshots produce no change records, so changes/ may not
          # exist yet (git add on a missing pathspec is an error).
          if [ -d changes ]; then
            git add changes/
          fi
          if git diff --cached --quiet; then
            echo "no new change records"
          else
            git commit -m "crawl: change records"
          fi

      - name: Push the archive (snapshots + change records)
        # BEFORE summarize on purpose: the archive must never be hostage to
        # the model provider. GITHUB_TOKEN on purpose (see the header): its
        # pushes trigger no workflow runs. Nothing to push is a normal,
        # successful outcome.
        run: git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Summarize new change records
        id: summarize
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        # A summarize failure does NOT fail this job: the archive is already
        # pushed, records publish honestly summary-less (feeds and pages both
        # carry a "no validated summary" state), and every unsummarised
        # record is retried on the next run (up to MAX_SUMMARY_ATTEMPTS paid
        # failures per record, inplain/summarize.py). The failure is surfaced through
        # the alert job via the summarize_failed output instead.
        run: |
          if [ -z "${MODEL_API_KEY}" ]; then
            note="MODEL_API_KEY secret is not set; summarize skipped. Records stay retryable — the next run with a key summarizes them."
            echo "$note"
            echo "**Summarize:** $note" >> "$GITHUB_STEP_SUMMARY"
            echo "summarize_failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python -m inplain.summarize | tee "$RUNNER_TEMP/summarize-report.txt"
          status=$?
          set -e
          {
            echo "## Summarize report"
            echo '```'
            cat "$RUNNER_TEMP/summarize-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "summarize_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::summarize left records unsummarised (exit $status); they stay retryable"
          else
            echo "summarize_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push summaries
        run: |
          if [ -d changes ]; then
            git add changes/
          fi
          if git diff --cached --quiet; then
            echo "no new summaries"
          else
            git commit -m "crawl: summaries"
            # Only the summaries commit is replayed; nothing is keyed on its sha.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build the static site (feeds are written by the site build)
        run: python -m inplain.site

      # --- deploy: gated on the DEPLOY_PAGES repository variable so the same
      # workflow works while the repo is private (Pages unavailable on Free)
      # and after it goes public (hosting.md §3, §7).
      - name: Configure GitHub Pages
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

      - name: Upload site as a build artifact (Pages deploy disabled)
        if: vars.DEPLOY_PAGES != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site/
          retention-days: 14

  deploy:
    needs: crawl
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialize with ci.yml's deploy job so two Pages deployments never race.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # With no server there is no error tracking: a red scheduled run is the only
  # signal the product stopped working. Make noise a human sees — one pinned
  # issue, created once and updated per failure, never duplicated.
  alert-on-failure:
    needs: [crawl, deploy]
    # 'cancelled' covers a crawl killed by its 30-minute timeout, which GitHub
    # records as cancelled rather than failed; without it a daily hang would
    # stop the archive silently (docs/operations.md).
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.crawl.outputs.summarize_failed == 'true')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update the pinned failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Scheduled crawl failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $RUN_URL"
            echo "updated open issue #$number"
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "The scheduled crawl workflow failed. Latest failing run: $RUN_URL

          Until this is fixed the archive is not being updated. Close this issue once a scheduled run succeeds.")
            number="${url##*/}"
            echo "created issue #$number"
          fi
          # Pin it so it cannot scroll out of sight. Best-effort: pinning
          # fails when the 3-pin limit is hit or it is already pinned.
          node_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq .node_id)
          # shellcheck disable=SC2016  # $id is a GraphQL variable, not shell
          gh api graphql \
            -f query='mutation($id: ID!) { pinIssue(input: {issueId: $id}) { issue { number } } }' \
            -f id="$node_id" \
            || echo "could not pin issue #$number (already pinned or pin limit reached)"
