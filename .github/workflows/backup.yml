name: backups

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pg_dump backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: bash ./scripts/backup/postgres_backup.sh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: .backups/postgres/
          retention-days: 30
