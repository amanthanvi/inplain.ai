{% extends 'base.html' %}

{% block content %}
<h1>All Companies</h1>
<div class="list-group">
    {% for company in companies %}
    <a href="{{ url_for('main_bp.company_profile', slug=company.slug) }}"
        class="list-group-item list-group-item-action">
        {{ company.name }}
    </a>
    {% endfor %}
</div>
{% endblock %}
