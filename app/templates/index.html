{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Welcome to the Security Policy Tracker</h1>
    <div class="recent-changes">
        <h2 class="text-center mb-3">Recent Policy Updates</h2>
        <div class="change-card-container">
            {% for change in recent_changes %}
            <div class="change-card">
                <h2 class="company-name"><a href="{{ url_for('main_bp.company_profile', slug=change.company_slug) }}">{{
                        change.company }}</a></h2>
                <p class="changed-on"><strong>Changed On:</strong> {{ change.changed_at }}</p>
                <p class="summary">{{ change.summary }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
