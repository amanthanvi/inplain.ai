<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ company.name }} - Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <div class="container mt-4">
        <header class="mb-4">
            <h1>{{ company.name }}</h1>
            <img src="https://logo.clearbit.com/{{ company.website }}" alt="{{ company.name }} Logo">
            <p><small>Logos provided by <a href="https://clearbit.com">Clearbit</a></small></p>
        </header>

        <div class="row">
            <div class="col-12 col-md-8">
                <h2>Overview</h2>
                <p>{{ company.overview }}</p>
            </div>
            <div class="col-12 col-md-4">
                <h2>Contact</h2>
                <p><strong>Website:</strong> <a href="{{ company.website }}">{{ company.website }}</a></p>
            </div>
        </div>

        <!-- Section: Timeline -->
        <section class="py-5">
            <ul class="timeline">
                {% for change in company.policy_changes %}
                <li class="timeline-item mb-5">
                    <h5 class="fw-bold">{{ change.changed_at.strftime('%Y-%m-%d') }}</h5>
                    <p class="text-muted mb-2 fw-bold">Change Summary</p>
                    <p class="text-muted">
                        {{ change.summary }}
                    </p>
                </li>
                {% endfor %}
            </ul>
        </section>
        <!-- Section: Timeline -->

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
