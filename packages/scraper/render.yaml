services:
  - type: web
    name: inplain-scraper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 api_server:app
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SCRAPY_SETTINGS_MODULE
        value: scrapy_settings
      - key: SCRAPER_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://inplain.ai
      - key: REDIS_URL
        fromService:
          type: redis
          name: scraper-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  - type: redis
    name: scraper-redis
    plan: free # Uses Render's Redis partnership
    ipAllowList: [] # Allow connections from your web service