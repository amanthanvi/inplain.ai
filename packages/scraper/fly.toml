# Fly.io configuration for Python scraper

app = "inplain-scraper"
primary_region = "iad" # US East

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  SCRAPY_SETTINGS_MODULE = "scrapy_settings"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0 # Scale to zero when not in use
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[processes]
  app = "gunicorn --bind 0.0.0.0:8080 --workers 1 --threads 2 --timeout 120 api_server:app"