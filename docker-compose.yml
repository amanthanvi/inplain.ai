services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inplain
      POSTGRES_USER: inplain
      POSTGRES_PASSWORD: inplain
    ports:
      - "54321:5432"
    volumes:
      - inplain_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  inplain_postgres_data:
